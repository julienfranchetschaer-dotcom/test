<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .container {
            border: 2px solid #e1e4e8;
            border-radius: 10px;
            padding: 30px;
            background-color: #fafbfc;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            background-color: #28a745;
            color: white;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>
        Hey Zach
        </h1>

    <div class="container">
        <h1>🚀 Deployment Successful!</h1>
        <p>If you can see this page, your custom HTML is being hosted correctly on GitHub Pages.</p>
        
        <div id="js-check">
            <p>Checking JavaScript...</p>
        </div>

        <div class="status-badge">Site is Live</div>
    </div>

    <script>
        // Simple script to verify JS is working
        document.getElementById('js-check').innerHTML = '<p style="color: #0366d6;">✅ JavaScript is also working perfectly.</p>';
        console.log("GitHub Pages test script executed.");
    </script>
</body>
</html>
